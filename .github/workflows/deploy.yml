# Déploiement sur GitHub Pages à chaque push sur main.
# Réglages du repo : Settings → Pages → Source : « GitHub Actions ».
# Variables (Settings → Secrets and variables → Actions → Variables) :
#   SITE_URL  (facultatif : par défaut https://ethanbacquier.github.io)
#   BASE      (facultatif : par défaut /)
#   FORM_KEY  (clé Web3Forms, publique par conception)
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://ethanbacquier.github.io' }}
          VITE_BASE: ${{ vars.BASE || '/' }}
          VITE_FORM_KEY: ${{ vars.FORM_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

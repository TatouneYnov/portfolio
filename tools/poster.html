<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Poster avatar</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
// Outil de développement : rend une image fixe de l'avatar (fond transparent).
// ?view=bust|desk&w=900&h=1000 — ouvert via `npm run dev` puis /tools/poster.html
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildAvatar, buildDesk, JOINT_KEYS, makePose, idlePose, sitPose } from '/src/three/avatar.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'bust', W = +(q.get('w') || 900), H = +(q.get('h') || 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0, 0); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.35;
scene.add(new THREE.HemisphereLight(0xB9A6FF, 0x120C1E, 0.6));
const key = new THREE.DirectionalLight(0xFFF2E8, 1.7); key.position.set(1.5, 2.6, 2.6); scene.add(key);
const rim = new THREE.DirectionalLight(0x8B5CF6, 3.2); rim.position.set(-2, 2.2, -2.6); scene.add(rim);
const fill = new THREE.PointLight(0x7C3AED, 4, 7, 1.6); fill.position.set(-1.3, 1.3, 1); scene.add(fill);
const av = buildAvatar(); scene.add(av.root);
const J = { hips: av.hips, spine: av.spine, chest: av.chest, neck: av.neck, head: av.head, uaL: av.arms.L.ua, uaR: av.arms.R.ua, laL: av.arms.L.la, laR: av.arms.R.la, hL: av.arms.L.hand, hR: av.arms.R.hand, ulL: av.legs.L.ul, ulR: av.legs.R.ul, llL: av.legs.L.ll, llR: av.legs.R.ll, fL: av.legs.L.foot, fR: av.legs.R.foot };
const P = makePose(); (view === 'desk' ? sitPose : idlePose)(0.6, P);
for (const k of JOINT_KEYS) J[k].rotation.set(...P[k]);
av.hips.position.y = P.hipsY;
av.head.rotation.y += view === 'desk' ? 0 : 0.18; av.head.rotation.x += view === 'desk' ? 0 : -0.04;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 40);
if (view === 'desk') {
  const d = buildDesk(); scene.add(d.group); d.screen.draw();
  cam.position.set(2.75, 1.65, -0.95).sub(new THREE.Vector3(0.05, 0.86, 0.3)).normalize().multiplyScalar(4.1).add(new THREE.Vector3(0.05, 0.86, 0.3));
  cam.lookAt(0.05, 0.86, 0.3);
} else if (view === 'og') {
  cam.position.set(0.55, 1.5, 2.25); cam.lookAt(0, 1.38, 0);
} else {
  cam.position.set(0.2, 1.5, 2.75); cam.lookAt(0, 1.36, 0);
}
await document.fonts.ready;
setTimeout(() => { renderer.render(scene, cam); document.title = 'ready'; }, 300);
</script></body></html>

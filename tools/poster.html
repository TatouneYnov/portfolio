<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Poster avatar</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
// Outil de développement : rend une image fixe de l'avatar (fond transparent).
// ?view=bust|desk|og|face|head|full|hands|shoes|collar|deskfront|kb&w=900&h=1000 — ouvert via `npm run dev` puis /tools/poster.html
// Contrôle : &turn=0.6 (rotation de l'avatar en radians, 1.57 = profil), &bg=1 (fond du site au lieu du transparent),
// &gaze=0.4 (regard vers la droite), &blink=0 (paupières fermées).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildAvatar, buildDesk, buildLights, JOINT_KEYS, makePose, idlePose, sitPose } from '/src/three/avatar.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'bust', W = +(q.get('w') || 900), H = +(q.get('h') || 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x07050C, q.get('bg') ? 1 : 0); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.35;
scene.add(buildLights());
const av = buildAvatar(); scene.add(av.root);
av.root.rotation.y = +(q.get('turn') || 0);
av.setGaze(+(q.get('gaze') || 0), 0);
av.setBlink(+(q.get('blink') ?? 1));
const J = { hips: av.hips, spine: av.spine, chest: av.chest, neck: av.neck, head: av.head, uaL: av.arms.L.ua, uaR: av.arms.R.ua, laL: av.arms.L.la, laR: av.arms.R.la, hL: av.arms.L.hand, hR: av.arms.R.hand, ulL: av.legs.L.ul, ulR: av.legs.R.ul, llL: av.legs.L.ll, llR: av.legs.R.ll, fL: av.legs.L.foot, fR: av.legs.R.foot };
const P = makePose(); (view === 'desk' || view === 'deskfront' || view === 'kb' ? sitPose : idlePose)(0.6, P);
for (const k of JOINT_KEYS) J[k].rotation.set(...P[k]);
av.hips.position.y = P.hipsY;
const still = view === 'desk' || view === 'deskfront' || view === 'kb' || view === 'face' || view === 'head';
av.head.rotation.y += still ? 0 : 0.18; av.head.rotation.x += still ? 0 : -0.04;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 40);
if (view === 'desk' || view === 'deskfront' || view === 'kb') {
  const d = buildDesk(); scene.add(d.group); d.screen.draw();
  cam.position.set(2.75, 1.65, -0.95).sub(new THREE.Vector3(0.05, 0.86, 0.3)).normalize().multiplyScalar(4.1).add(new THREE.Vector3(0.05, 0.86, 0.3));
  cam.lookAt(0.05, 0.86, 0.3);
  if (view === 'kb') { cam.position.set(-0.55, 1.05, 0.05); cam.lookAt(-0.05, 0.6, 0.45); }
  if (view === 'deskfront') { cam.position.set(-1.6, 1.5, 2.4); cam.lookAt(0, 0.6, 0.4); }
} else if (view === 'full') {
  cam.position.set(0.3, 0.95, 4.2); cam.lookAt(0, 0.82, 0);
} else if (view === 'collar') {
  cam.position.set(0, 1.25, 0.75); cam.lookAt(0, 1.17, 0);
} else if (view === 'shoes') {
  cam.position.set(0.55, 0.3, 0.75); cam.lookAt(0.05, 0.06, 0.05);
} else if (view === 'hands') {
  cam.position.set(0.55, 0.62, 0.9); cam.lookAt(0.22, 0.58, 0);
} else if (view === 'head') {
  cam.position.set(0, 1.55, 2.1); cam.lookAt(0, 1.5, 0);
} else if (view === 'face') {
  cam.position.set(0, 1.42, 1.45); cam.lookAt(0, 1.4, 0);
} else if (view === 'og') {
  cam.position.set(0.55, 1.5, 2.25); cam.lookAt(0, 1.38, 0);
} else {
  cam.position.set(0.2, 1.5, 2.75); cam.lookAt(0, 1.36, 0);
}
await document.fonts.ready;
setTimeout(() => { renderer.render(scene, cam); document.title = 'ready'; }, 300);
</script></body></html>
